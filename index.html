<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모의 주식 투자</title>
<style>
:root{
  --paper:#F1F6F0;
  --grid:#D8E4DA;
  --ink:#16213E;
  --ink-2:#4B5568;
  --rule:#C9D5CC;
  --white:#FFFFFF;
  --up:#D62839;
  --down:#1D5FD1;
  --mark:#FFE45C;
  --font:"Pretendard Variable","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font:16px/1.55 var(--font);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 96px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-2)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #fff}

/* 버튼 */
.btn{min-height:44px;padding:8px 18px;border:2px solid var(--ink);border-radius:6px;background:#fff;font-weight:700;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:#EEF3EE}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.buy{background:var(--up);border-color:var(--up);color:#fff}
.btn.buy:hover:not(:disabled){background:#B81F2F}
.btn.sell{background:var(--down);border-color:var(--down);color:#fff}
.btn.sell:hover:not(:disabled){background:#174DAA}
.btn.main{background:var(--ink);color:#fff;padding:10px 24px}
.btn.main:hover:not(:disabled){background:#0C1530}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}
.link{background:none;border:0;padding:4px 2px;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:14px}

/* 시작 화면 */
.start{max-width:560px;margin:6vh auto 0;background:#fff;border:2px solid var(--ink);border-top:6px double var(--ink);padding:28px 26px 26px}
.start h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
.start h1 mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit}
.start .sub{margin:0 0 22px;color:var(--ink-2)}
.field{display:block;margin-bottom:18px}
.field>span,.fieldset legend{display:block;font-weight:700;margin-bottom:6px;padding:0}
.field input[type=text]{width:100%;min-height:48px;padding:8px 12px;border:2px solid var(--ink);border-radius:6px;background:#fff;font-size:18px}
.fieldset{border:0;margin:0 0 20px;padding:0}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.segs.two{grid-template-columns:repeat(2,1fr)}
.fhint{margin:-10px 0 16px;font-size:14px;color:var(--ink-2);min-height:0}
.fhint:empty{display:none}
.segs label{position:relative}
.segs input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.segs span{display:block;text-align:center;padding:10px 0;border:2px solid var(--ink);border-radius:6px;font-weight:700;background:#fff}
.segs input:checked+span{background:var(--ink);color:#fff}
.segs input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px #fff}
.rules{margin:22px 0 0;padding:14px 16px;background:#F6F9F5;border-left:4px solid var(--ink);font-size:15px}
.rules ul{margin:6px 0 0;padding-left:18px}
.saves{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px}
.saves h2{font-size:15px;margin:0 0 8px}
.saves ul{list-style:none;margin:0;padding:0}
.saves li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule)}
.err{color:#B3202F;font-weight:700;margin:8px 0 0;min-height:1.4em}

/* 머리글 */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who .name{font-size:26px;font-weight:800;letter-spacing:-.02em}
.who .grp{background:var(--ink);color:#fff;border-radius:5px;padding:2px 10px;font-weight:700}
.tape{display:flex;gap:6px;list-style:none;padding:0;margin:0;flex-wrap:wrap}
.tape li{border:2px solid var(--ink);border-radius:6px;padding:3px 10px;font-weight:700;font-size:14px;background:#fff;min-width:72px;text-align:center;line-height:1.3}
.tape li small{display:block;font-weight:500;font-size:12px}
.tape .done{background:var(--ink);color:#fff}
.tape .now{background:var(--mark)}
.tape .todo{border-style:dashed;color:var(--ink-2);background:transparent}

.board{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:flex-end;background:#fff;border:2px solid var(--ink);padding:14px 18px;margin-bottom:16px}
.board .label{font-size:14px;color:var(--ink-2);font-weight:600}
.total-num{font-size:clamp(38px,8vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.total-num mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;padding:0 .08em}
.total-num small{font-size:.4em;font-weight:700;margin-left:6px;letter-spacing:0}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;margin-bottom:0}
.tab{border:2px solid var(--ink);border-bottom:0;background:transparent;padding:9px 22px;font-weight:700;cursor:pointer;border-radius:6px 6px 0 0;min-height:44px}
.tab[aria-selected=true]{background:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.sheet{background:#fff;border:2px solid var(--ink);padding:18px 18px 22px}
.sheet h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
.sheet .lead{margin:0 0 14px;color:var(--ink-2);font-size:15px}

/* 장부(거래) */
.ledger{border-top:4px double var(--ink);border-bottom:2px solid var(--ink);border-left:3px solid rgba(214,40,57,.35)}
.lrow{display:grid;grid-template-columns:minmax(110px,1fr) 112px 56px 56px 84px minmax(410px,3fr);gap:8px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule)}
.lrow:last-child{border-bottom:0}
.lhead{background:#EAF0EB;font-weight:700;font-size:14px;padding-top:8px;padding-bottom:8px}
.sname{font-weight:800;font-size:17px}
.smeta{font-size:13px;color:var(--ink-2)}
.smeta span+span{margin-left:8px}
.price b{font-size:18px}
.price .chg{display:block;font-size:13px;font-weight:700}
.spark{display:block;margin-top:2px}
.trade{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.qty{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.qty button{width:36px;min-height:40px;border:0;background:#EEF3EE;font-size:18px;font-weight:700;cursor:pointer}
.qty button:hover{background:#DDE7DF}
.qty input{width:56px;border:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);text-align:center;font-weight:700;font-size:17px;background:#fff}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:999px;min-height:32px;padding:0 10px;font-size:13px;font-weight:700;cursor:pointer}
.est{flex-basis:100%;font-size:13px;color:var(--ink-2);min-height:1.2em}
.cellp::before{display:none;content:attr(data-l);font-size:12px;color:var(--ink-2);font-weight:600;margin-right:6px}

.panel2{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}
.box{border:2px solid var(--ink);padding:14px 16px;background:#fff}
.box h3{margin:0 0 4px;font-size:17px}
.box p{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.closebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.closebox input{width:170px;min-height:48px;border:2px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:22px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-align:center;background:#fff}
.log summary{cursor:pointer;font-weight:700;font-size:14px}
.log ul{margin:6px 0 0;padding-left:18px;font-size:14px}

.mini{display:none;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--ink);color:#fff;padding:8px max(14px,env(safe-area-inset-left));justify-content:space-between;align-items:center;gap:12px;font-weight:600;font-size:15px}
.mini.show{display:flex}
.mini.low{background:var(--up)}
.mini b{font-size:20px;font-variant-numeric:tabular-nums}
.clockbox{margin-left:auto;min-width:150px;text-align:right}
.clock{font-size:clamp(34px,6vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.bar{height:9px;border:2px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--ink)}
.clockbox.low .clock{color:var(--up)}
.clockbox.low .bar i{background:var(--up)}
.clockbox.over .clock{color:var(--ink-2)}
.startbox{margin:0 0 16px;background:var(--mark)}
.startbox p{color:var(--ink)}
/* 결과 */
.ychips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.ychips button{border:2px solid var(--ink);background:#fff;border-radius:6px;min-height:40px;padding:0 14px;font-weight:700;cursor:pointer}
.ychips button[aria-pressed=true]{background:var(--ink);color:#fff}
.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sumrow div{border:2px solid var(--ink);padding:10px 14px;background:#fff}
.sumrow .k{display:block;font-size:13px;color:var(--ink-2);font-weight:600}
.sumrow .v{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sumrow .big{background:var(--mark);border-color:var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(130px,1.3fr) 90px 90px 90px 70px 110px 90px;gap:6px 12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule)}
.rrow:last-child{border-bottom:0}
.rrow.off{color:var(--ink-2)}
.rrow .r{text-align:right}
.rhead{background:#EAF0EB;font-weight:700;font-size:14px}
.events{list-style:none;margin:8px 0 0;padding:0}
.events li{padding:10px 0;border-bottom:1px solid var(--rule)}
.tag{display:inline-block;font-size:13px;font-weight:700;border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;margin-right:6px;background:#fff}
.pill{display:inline-block;font-size:13px;font-weight:700;border-radius:4px;padding:1px 7px;margin:3px 6px 0 0;border:1.5px solid currentColor}
.mine{margin-left:6px;font-size:12px;font-weight:700;background:var(--mark);padding:0 6px;border-radius:3px}
h3.sec{font-size:18px;margin:22px 0 6px}
.chart{width:100%;height:auto;max-width:680px;display:block}
.cmp{width:100%;max-width:680px;border-collapse:collapse}
.cmp td,.cmp th{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left}
.cmp td:last-child,.cmp th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cmp .me td{background:var(--mark);font-weight:800}
.reflect{margin:6px 0 0;padding-left:20px}
.note{margin:12px 0 0;padding:10px 14px;border-left:4px solid var(--ink);background:#F6F9F5;font-size:14px}
.warn{margin:0 0 14px;padding:10px 14px;border:2px solid #B3202F;background:#FDEBEC;font-weight:700;font-size:14px}

/* 알림과 확인 */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-weight:600;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .18s;z-index:30;font-size:15px}
#toast.on{opacity:1}
.veil{position:fixed;inset:0;background:rgba(22,33,62,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:#fff;border:2px solid var(--ink);border-top:6px double var(--ink);max-width:440px;width:100%;padding:20px 20px 16px}
.modal p{margin:0 0 16px;font-size:17px;font-weight:600}
.modal .acts{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:1020px){
  .lhead,.rhead{display:none}
  .lrow{grid-template-columns:1fr 1fr 1fr;padding:12px 10px}
  .lrow>.c-name{grid-column:1/3}
  .lrow>.price{grid-column:3;text-align:right}
  .lrow>.c-trade{grid-column:1/-1}
  .price .spark{margin-left:auto}
  #toast{bottom:auto;top:58px}
  .cellp::before{display:inline}
  .rrow{grid-template-columns:1fr 1fr;padding:12px 10px}
  .rrow>.c-name{grid-column:1/-1}
  .rrow .r{text-align:left}
  .panel2{grid-template-columns:1fr}
  .tab{padding:9px 16px}
}
@media (max-width:520px){
  .trade .chip{display:none}
  .trade .btn{padding:8px 12px;min-width:60px}
  .wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

/* 금액 표시: 내부 값 100 = 1만 원 → 원 단위로 바꿔 쉼표를 찍어요 */
const comma = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmtN = c => comma(Math.abs(Math.round(c)) * 100);
const fmt = c => (c < 0 ? '−' : '') + fmtN(c) + '원';

const pct = r => (r > 0.00005 ? '+' : r < -0.00005 ? '−' : '') + Math.abs(r * 100).toFixed(1) + '%';
const dir = r => (r > 0.00005 ? 'up' : r < -0.00005 ? 'down' : 'flat');
const arrow = r => (r > 0.00005 ? '▲' : r < -0.00005 ? '▼' : '–');
function hash53(str, seed){
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

  set(k, v){ try { localStorage.setItem(k, v); } catch(e){ mem[k] = v; ui.noStore = true; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } },
  keys(){ try { return Object.keys(localStorage); } catch(e){ return Object.keys(mem); } }
};

/* 이름 칸 해석: 개인은 한 명, 모둠은 모둠원 전체(쉼표·띄어쓰기로 구분) */
function parseNames(mode, raw){
  const clean = String(raw || '').replace(/[|]/g, ' ');
  if (mode === 'solo'){
    if (/[,，、\/]/.test(clean)) return { err:'개인은 본인 이름만 쓰세요. 모둠으로 하려면 위에서 "모둠"을 고르세요.' };
    const nm = clean.trim().replace(/\s+/g, ' ');
    if (!nm) return { err:'이름을 입력하세요.' };
    if (nm.length > 10) return { err:'이름은 10글자 이내로 써 주세요.' };
    return { list:[nm], name:nm };
  }
  const seen = new Set(), list = [];
  clean.split(/[,，、\/\n]+|\s+/).map(x => x.trim()).filter(Boolean).forEach(x => { const k = x.toLowerCase(); if (!seen.has(k)){ seen.add(k); list.push(x); } });
  if (list.length < 2) return { err:'모둠원 이름을 모두 쓰세요. (2명 이상, 쉼표로 구분) 혼자 하는 경우에는 "개인"을 고르세요.' };
  if (list.length > 10) return { err:'모둠원은 10명까지 쓸 수 있어요.' };
  if (list.some(x => x.length > 10)) return { err:'이름은 10글자 이내로 써 주세요.' };
  return { list, name:list.join(', ') };
}

    : mode === 'solo'

function sigOf(s){
  return hash53(JSON.stringify([s.mode, s.name, s.year, s.stage, s.cash, s.hold, s.t0, s.closed.map(c => [c.y, c.total, c.end])]) + SIG_SALT);
}
function persist(){
  S.sig = sigOf(S);
  store.set(keyOf(S.mode, S.name), JSON.stringify(S));
}
function loadGame(m, n){
  const raw = store.get(keyOf(m, n));
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (!s || s.v !== 3 || !Array.isArray(s.hold) || !Array.isArray(s.closed)) return null;
    if (s.sig !== sigOf(s)) s.flagged = true;
    return s;
  } catch(e){ return null; }
}
function newGame(m, n){
  return { v:3, name:n, mode:m, year:1, stage:'ready', t0:0, cash:START_CASH, hold:STOCKS.map(() => 0), trades:{}, closed:[], flagged:false, sig:'' };
}
function listSaves(){
  const out = [];
  store.keys().forEach(k => {
    if (k.indexOf(KEY_PREFIX) !== 0) return;
    try {
      const s = JSON.parse(store.get(k));
      if (s && s.name) out.push({ key:k, name:s.name, mode:s.mode, done:s.closed.length, stage:s.stage });
    } catch(e){}
  });
  return out.sort((a, b) => (a.mode === b.mode ? 0 : a.mode === 'team' ? -1 : 1) || a.name.localeCompare(b.name, 'ko'));
}

function startPrices(y){ return y === 1 ? STOCKS.map(s => s.p) : S.closed[y - 2].end; }
function stockValue(prices){ return S.hold.reduce((a, q, i) => a + q * prices[i], 0); }
function currentTotal(){
  if (S.stage === 'done') return S.closed[YEARS - 1].total;
  return S.cash + stockValue(startPrices(S.year));
}

async function decryptPack(code, p){
  if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  const mat = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(p.s), iterations:100000, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(p.i) }, key, b64(p.c));
  return JSON.parse(new TextDecoder().decode(buf));
}

function settle(y, pack){
  const start = startPrices(y), end = pack.prices;
  const rows = S.hold.map((q, i) => ({ q, p0:start[i], p1:end[i], v:q * end[i], dv:q * STOCKS[i].d, pl:q * (end[i] - start[i]) }));
  const value = rows.reduce((a, r) => a + r.v, 0);
  const div = rows.reduce((a, r) => a + r.dv, 0);
  const cashBefore = S.cash;
  const cashEnd = cashBefore + div;
  const total = cashEnd + value;
  const prev = y === 1 ? START_CASH : S.closed[y - 2].total;
  return { y, start, end, rows, value, div, cashBefore, cashEnd, total, ret:total / prev - 1, cum:total / START_CASH - 1, events:pack.events || [] };
}

function remainMs(){
  if (S.stage === 'ready') return YEAR_SECONDS * 1000;
  if (S.stage === 'trade') return Math.max(0, S.t0 + YEAR_SECONDS * 1000 - Date.now());
  return 0;
}
const clockText = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function clockHTML(){
  if (S.stage === 'done') return '';
  return '<div class="clockbox" id="clockbox"><span class="label" id="clockLabel"></span><div class="clock num" id="clock" role="timer"></div><div class="bar"><i id="clockBar"></i></div></div>';
}
function updateClock(){
  const box = $('#clockbox'); if (!box || !S) return;
  const ms = remainMs();
  $('#clock').textContent = clockText(ms);
  $('#clockLabel').textContent = S.stage === 'ready' ? '시작 전' : S.stage === 'trade' ? '남은 시간' : '시간 종료';
  $('#clockBar').style.width = (S.stage === 'ready' ? 100 : ms / (YEAR_SECONDS * 10)) + '%';
  box.classList.toggle('low', S.stage === 'trade' && ms <= 60000);
  box.classList.toggle('over', S.stage === 'locked');
  const mini = $('#mini');
  if (mini){
    $('#miniLabel').textContent = S.stage === 'locked' ? '시간 종료' : S.stage === 'ready' ? '시작 전' : '남은 시간';
    $('#miniClock').textContent = clockText(ms);
    $('#miniCash').textContent = fmt(S.cash);
    mini.classList.toggle('low', S.stage === 'trade' && ms <= 60000);

}
let io = null;
function watchBoard(){
  if (io){ io.disconnect(); io = null; }
  const board = $('.board'), mini = $('#mini');
  if (!board || !mini || !('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => {
    const out = !es[0].isIntersecting;
    mini.classList.toggle('show', !!(out && S && (S.stage === 'trade' || S.stage === 'locked') && ui.tab === 'trade'));
  });
  io.observe(board);
}

function sparkSVG(i, y){
  if (y < 2) return '';
  const pts = []; for (let k = 1; k <= y; k++) pts.push(startPrices(k)[i]);
  const mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts), W = 64, H = 22, pad = 3;
  const X = k => pad + k * (W - 2 * pad) / (pts.length - 1);
  const Y = v => mx === mn ? H / 2 : H - pad - (v - mn) * (H - 2 * pad) / (mx - mn);
  const d = pts.map((v, k) => (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const last = pts[pts.length - 1] - pts[pts.length - 2];
  return '<svg class="spark" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연초 주가 추이"><path d="' + d + '" fill="none" stroke="#16213E" stroke-width="1.6"/><circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(pts[pts.length - 1]).toFixed(1) + '" r="2.6" class="' + dir(last) + '" fill="currentColor"/></svg>';
}

    '<div class="box"><h3>' + y + '년차 ' + (S.stage === 'locked' ? '결과 확인하기' : '마감하기') + '</h3><p>' +
    (S.stage === 'locked' ? '선생님이 알려 주는 ' + y + '년차 연말 코드를 입력하면 결과를 볼 수 있어요.' : '시간이 끝나기 전에 연말 코드를 받았다면 바로 마감할 수 있어요. 마감하면 이번 해 거래를 바꿀 수 없어요.') + '</p>' +
    '<form class="closebox" id="closeForm" autocomplete="off"><input type="text" id="codeIn" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="연말 코드(숫자 6자리)" aria-label="연말 코드, 숫자 6자리" autocomplete="off" spellcheck="false"><button class="btn main" type="submit"' + (ui.busy ? ' disabled' : '') + '>' + (ui.busy ? '확인하는 중…' : S.stage === 'locked' ? '결과 보기' : '마감하고 결과 보기') + '</button></form>' +
    '<p class="err" id="closeErr" role="alert">' + esc(ui.err) + '</p></div>';
  return '<h2>' + y + '년차 거래</h2><p class="lead">' + lead + '</p>' + startBox +
    '<div class="ledger"><div class="lrow lhead" aria-hidden="true"><div>종목</div><div>연초 주가</div><div>배당</div><div>보유</div><div>평가액</div><div>거래</div></div>' + rows + '</div>' +
    (closeBox ? '<div class="panel2">' + closeBox + '</div>' : '') +
    '<details class="log box" style="margin-top:16px"' + (trades.length ? ' open' : '') + '><summary>이번 해 거래 내역 (' + trades.length + '건)</summary>' + log + '</details>';
}

function refreshRow(i){
  const row = $('[data-row="' + i + '"]'); if (!row || !$('[data-qty="' + i + '"]', row)) return;
  const p = startPrices(S.year)[i];
  const input = $('[data-qty="' + i + '"]', row);
  const q = Math.max(0, parseInt(input.value, 10) || 0);
  const cost = q * p;
  $('[data-est="' + i + '"]', row).textContent = q ? (q + '주 = ' + fmt(cost)) : '수량을 1 이상으로 입력하세요.';
  $('[data-act=buy]', row).disabled = !(q >= 1 && cost <= S.cash);
  $('[data-act=sell]', row).disabled = !(q >= 1 && q <= S.hold[i]);
}

/* ----- 결과 페이지 ----- */
function lineChart(){
  const pts = [START_CASH].concat(S.closed.map(c => c.total));
  const W = 640, H = 230, L = 54, R = 18, T = 18, B = 34;
  const mn = Math.min(START_CASH, Math.min.apply(null, pts)), mx = Math.max(START_CASH, Math.max.apply(null, pts));
  const lo = Math.floor((mn - (mx - mn) * 0.15 - 1) / 1000) * 1000, hi = Math.ceil((mx + (mx - mn) * 0.15 + 1) / 1000) * 1000;
  const X = k => L + k * (W - L - R) / YEARS;
  const Y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  let g = '';
  for (let v = lo; v <= hi + 1; v += (hi - lo) / 4){ const yy = Y(v).toFixed(1); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#C9D5CC"/><text x="' + (L - 6) + '" y="' + (+yy + 4) + '" text-anchor="end" font-size="11" fill="#4B5568">' + Math.round(v / 100) + '만</text>'; }
  let x = ''; for (let k = 0; k <= YEARS; k++) x += '<text x="' + X(k).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="12" fill="#4B5568">' + (k ? k + '년차' : '시작') + '</text>';
  const base = '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(START_CASH).toFixed(1) + '" y2="' + Y(START_CASH).toFixed(1) + '" stroke="#16213E" stroke-dasharray="5 4"/>';
  const path = pts.map((v, k) => (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const dots = pts.map((v, k) => '<circle cx="' + X(k).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="4.5" class="' + (k ? dir(v - pts[k - 1]) : 'flat') + '" fill="currentColor" stroke="#fff" stroke-width="1.5"/>' + (k ? '<text x="' + X(k).toFixed(1) + '" y="' + (Y(v) - 10).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#16213E">' + fmtM(v) + '</text>' : '')).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연도별 총자산 변화">' + g + base + x + '<path d="' + path + '" fill="none" stroke="#16213E" stroke-width="2.5"/>' + dots + '</svg>';
}

function finalHTML(){
  const c5 = S.closed[YEARS - 1];
  const idx = STOCKS.map((s, i) => ({ i, mult:(c5.end[i] + YEARS * s.d) / s.p }));
  const best = idx.reduce((a, b) => b.mult > a.mult ? b : a), worst = idx.reduce((a, b) => b.mult < a.mult ? b : a);
  const eq = idx.reduce((a, b) => a + (START_CASH / STOCKS.length) * b.mult, 0);
  const list = [
    { l:'내 투자', v:c5.total, me:true },
    { l:'현금으로만 보관', v:START_CASH },
    { l:'10개 종목에 똑같이 나눠 5년 보유', v:Math.round(eq) },
    { l:'가장 많이 오른 ' + STOCKS[best.i].n + '에 모두 투자', v:Math.round(START_CASH * best.mult) },
    { l:'가장 많이 내린 ' + STOCKS[worst.i].n + '에 모두 투자', v:Math.round(START_CASH * worst.mult) }
  ].sort((a, b) => b.v - a.v);
  const divAll = S.closed.reduce((a, c) => a + c.div, 0);
  return '<h3 class="sec">5년 투자 결과</h3>' +
    '<div class="sumrow"><div class="big"><span class="k">5년 뒤 총자산</span><span class="v">' + fmt(c5.total) + '</span></div><div><span class="k">5년 수익률</span><span class="v ' + dir(c5.cum) + '">' + pct(c5.cum) + '</span></div><div><span class="k">받은 배당금 합계</span><span class="v">' + fmt(divAll) + '</span></div></div>' +
    '<h3 class="sec">다른 방법으로 투자했다면</h3>' +
    '<table class="cmp"><caption style="text-align:left;font-size:14px;color:var(--ink-2);padding-bottom:6px">배당을 포함하고, 5년 내내 한 번도 사고팔지 않았다고 가정했어요.</caption><thead><tr><th>투자 방법</th><th>5년 뒤 총자산</th></tr></thead><tbody>' +
    list.map(r => '<tr' + (r.me ? ' class="me"' : '') + '><td>' + esc(r.l) + '</td><td>' + fmt(r.v) + '</td></tr>').join('') + '</tbody></table>' +
    '<h3 class="sec">돌아보기</h3><ol class="reflect"><li>내가 가장 많이 번 종목과 가장 많이 잃은 종목은 무엇이고, 그 이유는 무엇일까요?</li><li>위 표에서 내 결과는 어디쯤인가요? 한 종목에 몰아서 투자하는 것과 나눠서 투자하는 것은 어떻게 달랐나요?</li><li>선생님께 받은 힌트를 어떻게 활용했나요? 힌트를 받은 해와 받지 않은 해의 결과는 어떻게 달랐나요?</li></ol>';
}

function resultHTML(){
  const n = S.closed.length;
  if (!n) return '<h2>결과</h2><p class="lead">아직 마감한 해가 없어요. 1년차를 마감하면 결과를 볼 수 있어요.</p>';
  let y = ui.resultYear && ui.resultYear <= n ? ui.resultYear : n;
  const c = S.closed[y - 1];
  const chips = S.closed.map(k => '<button data-act="ryear" data-y="' + k.y + '" aria-pressed="' + (k.y === y) + '">' + k.y + '년차</button>').join('');
  const fresh = ui.reveal === y;
  const num = (from, to, cls) => '<span class="num rv ' + (cls || '') + '" data-from="' + from + '" data-to="' + to + '">' + fmt(fresh ? from : to) + '</span>';
  let rows = '';
  c.rows.forEach((r, i) => {
    const chg = r.p1 / r.p0 - 1;
    rows += '<div class="rrow' + (r.q ? '' : ' off') + '">' +
      '<div class="c-name"><b>' + esc(STOCKS[i].n) + '</b>' + (r.q ? '<span class="mine">보유 ' + r.q + '주</span>' : '') + '</div>' +
      '<div class="r cellp num" data-l="연초">' + fmt(r.p0) + '</div>' +
      '<div class="r cellp num" data-l="연말"><b>' + num(r.p0, r.p1) + '</b></div>' +
      '<div class="r cellp num ' + dir(chg) + '" data-l="등락률"><b>' + arrow(chg) + ' ' + pct(chg) + '</b></div>' +
      '<div class="r cellp num" data-l="보유">' + r.q + '주</div>' +
      '<div class="r cellp num ' + (r.q ? dir(r.pl) : 'flat') + '" data-l="평가 손익"><b>' + (r.q ? fmtS(r.pl) : '–') + '</b></div>' +
      '<div class="r cellp num" data-l="배당금">' + (r.dv ? fmt(r.dv) : '–') + '</div></div>';
  });
  const prevTotal = y === 1 ? START_CASH : S.closed[y - 2].total;
  const ev = (c.events || []).map(e => {
    const pills = Object.keys(e.fx || {}).map(L => {
      const i = L.charCodeAt(0) - 65, v = e.fx[L];
      return '<span class="pill ' + dir(v) + '">' + esc(STOCKS[i].n) + ' ' + (v > 0 ? '+' : '−') + Math.abs(v) + '%</span>';
    }).join('');
    return '<li><span class="tag">' + esc(e.cat) + '</span><b class="num" style="font-size:13px;color:var(--ink-2)">' + esc(e.id) + '</b><div>' + esc(e.desc) + '</div><div>' + pills + '</div></li>';
  }).join('');
  const code = hash53([S.mode, S.name, y, c.total, S.flagged ? 1 : 0].join('|') + SIG_SALT).slice(0, 5).toUpperCase();
  const nextBtn = (y === n && S.stage !== 'done') ? '<button class="btn main" data-act="next">' + S.year + '년차 준비하기</button>' : '';
  return '<h2>' + y + '년차 결과</h2><div class="ychips" role="group" aria-label="연도 선택">' + chips + '</div>' +
    '<div class="sumrow"><div class="big"><span class="k">연말 총자산</span><span class="v">' + num(prevTotal, c.total) + '</span></div>' +
    '<div><span class="k">이번 해 수익률</span><span class="v ' + dir(c.ret) + '">' + pct(c.ret) + '</span></div>' +
    '<div><span class="k">시작 자금 대비</span><span class="v ' + dir(c.cum) + '">' + pct(c.cum) + '</span></div>' +
    '<div><span class="k">배당금</span><span class="v">' + fmt(c.div) + '</span></div>' +
    '</div>' +
    '<div class="ledger"><div class="rrow rhead" aria-hidden="true"><div>종목</div><div class="r">연초 주가</div><div class="r">연말 주가</div><div class="r">등락률</div><div class="r">보유</div><div class="r">평가 손익</div><div class="r">배당금</div></div>' + rows + '</div>' +
    '<h3 class="sec">이번 해 있었던 일</h3><ul class="events">' + ev + '</ul>' +
    '<h3 class="sec">총자산 변화</h3>' + lineChart() +
    (y === YEARS && S.stage === 'done' ? finalHTML() : '') +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center">' + nextBtn +
    '<button class="btn" data-act="copy" data-y="' + y + '">결과 복사하기</button><span class="smeta">확인 번호 ' + code + '</span></div>';
}

function runReveal(){
  const y = ui.reveal; ui.reveal = null;
  const els = Array.prototype.slice.call(document.querySelectorAll('.rv'));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ els.forEach(el => { el.textContent = fmt(+el.getAttribute('data-to')); }); return; }
  const dur = 1100, t0 = performance.now();
  function frame(t){
    let alive = false;
    els.forEach((el, k) => {
      const delay = k < 10 ? k * 70 : 0;
      const p = Math.min(1, Math.max(0, (t - t0 - delay) / dur));
      const e = 1 - Math.pow(1 - p, 3);
      const a = +el.getAttribute('data-from'), b = +el.getAttribute('data-to');
      el.textContent = fmt(Math.round(a + (b - a) * e));
      if (p < 1) alive = true;
    });
    if (alive) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ===== 동작 ===== */
function setQty(i, v){ ui.qty[i] = Math.max(0, Math.min(9999, v | 0)); const el = $('[data-qty="' + i + '"]'); if (el) el.value = ui.qty[i]; refreshRow(i); }
function getQty(i){ const el = $('[data-qty="' + i + '"]'); return Math.max(0, parseInt(el && el.value, 10) || 0); }

function trade(i, sign){
  if (S.stage !== 'trade' || remainMs() <= 0) return;
  const q = getQty(i), p = startPrices(S.year)[i];
  if (q < 1) return;
  if (sign > 0){ if (q * p > S.cash) return; S.cash -= q * p; S.hold[i] += q; }
  else { if (q > S.hold[i]) return; S.cash += q * p; S.hold[i] -= q; }
  (S.trades[S.year] = S.trades[S.year] || []).push({ i, q:sign * q });
  persist();
  toast(STOCKS[i].n + ' ' + q + '주를 ' + (sign > 0 ? '샀어요' : '팔았어요') + ' (' + fmtS(-sign * q * p));
  ui.focus = { act: sign > 0 ? 'buy' : 'sell', i };
  render();
}

async function closeYear(){
  const input = $('#codeIn'); const code = (input.value || '').trim().toUpperCase();
  const y = S.year;
  if (S.stage !== 'trade' && S.stage !== 'locked') return;
  if (!code){ ui.err = '연말 코드를 입력하세요.'; $('#closeErr').textContent = ui.err; return; }
  if (S.stage === 'trade'){ const ok = await confirmBox(y + '년차를 마감할까요? 마감하면 이번 해 거래를 바꿀 수 없어요.', '마감하기'); if (!ok) return; }
  ui.busy = true; ui.err = ''; render();
  try {
    const pack = await decryptPack(code, PACKS[y]);
    if (!pack || !Array.isArray(pack.prices) || pack.prices.length !== STOCKS.length) throw new Error('bad');
    const rec = settle(y, pack);
    S.cash = rec.cashEnd;
    S.closed.push(rec);
    if (y < YEARS){ S.year = y + 1; S.stage = 'ready'; S.t0 = 0; } else S.stage = 'done';
    persist();
    ui.busy = false; ui.tab = 'result'; ui.resultYear = y; ui.reveal = y; ui.qty = {};
    render(); window.scrollTo({ top:0 });
  } catch(e){
    ui.busy = false;
    ui.err = e && e.message === 'nocrypto' ? '이 브라우저에서는 열 수 없어요. Chrome이나 Edge 최신 버전에서 파일을 직접 열어 주세요.' : '코드가 맞지 않아요. 선생님이 알려 준 ' + y + '년차 연말 코드를 다시 확인하세요.';
    render();
  }
}

function copyText(t){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res, rej) => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); } ta.remove();
  });
}

/* ===== 이벤트 연결 ===== */
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'startForm'){
    const raw = $('#nameIn').value, mode = (document.querySelector('input[name=mode]:checked') || {}).value;
    ui.startName = raw;
    if (!mode){ ui.err = '참여 방식(모둠 또는 개인)을 선택하세요.'; render(); return; }
    ui.startMode = mode;
    const pn = parseNames(mode, raw);
    if (pn.err){ ui.err = pn.err; render(); $('#nameIn').focus(); return; }
    S = loadGame(mode, pn.name) || newGame(mode, pn.name);
    if (!store.get(keyOf(S.mode, S.name))) persist();
    normalizeStage();
    ui.tab = S.stage === 'done' ? 'result' : 'trade'; ui.err = ''; ui.qty = {}; ui.resultYear = null;
    render();
  } else if (e.target.id === 'closeForm'){ closeYear(); }
});

/* 시작 화면: 입력한 내용에 맞춰 안내 문구와 버튼 글자만 바꿈 (입력 중인 칸은 그대로 둠) */
function syncStart(){
  const m = ui.startMode, tx = startTexts(m);
  $('#nameLbl').textContent = tx.label; $('#nameIn').placeholder = tx.ph; $('#nameHint').textContent = tx.hint;
  const pn = m ? parseNames(m, ui.startName) : {};
  $('#startBtn').textContent = pn.name && store.get(keyOf(m, pn.name)) ? '이어서 하기' : '시작하기';
}

app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'nameIn'){ ui.startName = t.value; syncStart(); }
  else if (t.getAttribute && t.getAttribute('data-qty') != null){
    const i = +t.getAttribute('data-qty'); t.value = t.value.replace(/[^0-9]/g, '').slice(0, 4); ui.qty[i] = parseInt(t.value, 10) || 0; refreshRow(i);
  } else if (t.id === 'codeIn'){ t.value = t.value.replace(/[^0-9]/g, ''); }
});

app.addEventListener('change', e => {
  if (e.target.name === 'mode'){ ui.startMode = e.target.value; syncStart(); }
});

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
  if (act === 'buy') trade(i, 1);
  else if (act === 'sell') trade(i, -1);
  else if (act === 'inc') setQty(i, getQty(i) + 1);
  else if (act === 'dec') setQty(i, getQty(i) - 1);
  else if (act === 'setq') setQty(i, +b.getAttribute('data-v'));
  else if (act === 'start') startYear();
  else if (act === 'tab'){ ui.tab = b.getAttribute('data-t'); if (ui.tab === 'result' && !ui.resultYear) ui.resultYear = S.closed.length; render(); }
  else if (act === 'ryear'){ ui.resultYear = +b.getAttribute('data-y'); render(); }
  else if (act === 'next'){ ui.tab = 'trade'; ui.qty = {}; render(); window.scrollTo({ top:0 }); }
  else if (act === 'home'){ S = null; ui.err = ''; ui.startName = ''; ui.startMode = ''; render(); }
  else if (act === 'resume'){
    const k = b.getAttribute('data-key'); try { const s = JSON.parse(store.get(k)); S = loadGame(s.mode, s.name); normalizeStage(); ui.tab = S.stage === 'done' ? 'result' : 'trade'; ui.qty = {}; ui.resultYear = null; render(); } catch(err){}
  }
  else if (act === 'delsave'){
    const k = b.getAttribute('data-key');
    if (await confirmBox('이 기록을 삭제할까요? 삭제하면 되돌릴 수 없어요.', '삭제하기')){ store.del(k); render(); }
  }
  else if (act === 'copy'){
    const y = +b.getAttribute('data-y'), c = S.closed[y - 1];
    const code = hash53([S.mode, S.name, y, c.total, S.flagged ? 1 : 0].join('|') + SIG_SALT).slice(0, 5).toUpperCase();
    const text = '[' + MODE_LABEL[S.mode] + '] ' + S.name + ' / ' + y + '년차 총자산 ' + fmt(c.total) + ' (시작 자금 대비 ' + pct(c.cum) + ') / 확인 번호 ' + code;
    copyText(text).then(() => toast('결과를 복사했어요.')).catch(() => toast('복사하지 못했어요. 화면을 캡처해서 제출하세요.'));
  }
});

render();
})();
</script>
